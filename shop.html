let currentFilter = 'all';
let selectedItem = null;


function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  window.location.href = 'index.html';
}


function renderShop() {
  const grid = document.getElementById('shopGrid');
  let itemsToShow = [];
  
  if (currentFilter === 'all') {
    Object.values(items).forEach(cat => itemsToShow = itemsToShow.concat(cat));
  } else {
    itemsToShow = items[currentFilter] || [];
  }
  
  grid.innerHTML = itemsToShow.map((item, idx) => `
    <button onclick="openBuyModal('${item.name.replace(/'/g, "\\'")}', ${item.price})" style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:16px; cursor:pointer; width:100%; text-align:left;">
      <p style="color:#fff; font-weight:700; margin-bottom:8px; font-size:14px;">${item.name}</p>
      <p style="color:#00e5ff; font-size:16px; font-weight:700;">${item.price} ₽</p>
      ${item.desc ? `<p style="color:rgba(255,255,255,0.4); font-size:11px; margin-top:8px;">${item.desc}</p>` : ''}
    </button>
  `).join('');
}


function filterCategory(cat) {
  currentFilter = cat;
  document.querySelectorAll('.category-btn').forEach(btn => {
    if (btn.textContent.includes(event.target.textContent)) {
      btn.style.background = 'linear-gradient(135deg,#00e5ff,#8a5cff)';
      btn.style.color = '#000';
      btn.style.border = 'none';
    } else {
      btn.style.background = 'rgba(255,255,255,0.06)';
      btn.style.color = '#fff';
      btn.style.border = '1px solid rgba(255,255,255,0.1)';
    }
  });
  renderShop();
}


async function openBuyModal(itemName, price) {
  selectedItem = {name: itemName, price: price};
  document.getElementById('modalTitle').textContent = itemName;
  document.getElementById('modalPrice').textContent = price + ' ₽';
  document.getElementById('buyQuantity').value = 1;
  document.getElementById('modalError').style.display = 'none';
  
  const token = localStorage.getItem('token');
  if (token) {
    try {
      const res = await fetch(`${API}/profile`, {
        headers: {'Authorization': `Bearer ${token}`}
      });
      const user = await res.json();
      document.getElementById('modalBalance').textContent = user.balance + ' ₽';
    } catch (err) {
      document.getElementById('modalBalance').textContent = '—';
    }
  }
  
  updateBuyTotal();
  document.getElementById('buyModal').style.display = 'flex';
}


function closeBuyModal() {
  document.getElementById('buyModal').style.display = 'none';
}


function updateBuyTotal() {
  const qty = parseInt(document.getElementById('buyQuantity').value) || 1;
  const total = selectedItem.price * qty;
  document.getElementById('modalTotal').textContent = total + ' ₽';
}


async function confirmBuy() {
  const token = localStorage.getItem('token');
  if (!token) {
    document.getElementById('modalError').textContent = 'Нужно залогиниться';
    document.getElementById('modalError').style.display = 'block';
    return;
  }
  
  const qty = parseInt(document.getElementById('buyQuantity').value) || 1;
  const total = selectedItem.price * qty;
  
  if (total < 19 && selectedItem.price !== 1) {
    document.getElementById('modalError').textContent = 'Минимум 19 ₽';
    document.getElementById('modalError').style.display = 'block';
    return;
  }
  
  try {
    const res = await fetch(`${API}/shop/buy`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
      body: JSON.stringify({itemName: selectedItem.name, price: total, quantity: qty})
    });
    const data = await res.json();
    
    if (res.ok) {
      alert('✓ Заказ создан! Статус: Ожидает выдачи');
      closeBuyModal();
    } else if (res.status === 402) {
      document.getElementById('modalError').textContent = '❌ Недостаточно средств. Пополните счет!';
      document.getElementById('modalError').style.display = 'block';
      setTimeout(() => window.location.href = 'index.html#topup', 2000);
    } else {
      document.getElementById('modalError').textContent = data.error || 'Ошибка';
      document.getElementById('modalError').style.display = 'block';
    }
  } catch (err) {
    document.getElementById('modalError').textContent = 'Ошибка сервера';
    document.getElementById('modalError').style.display = 'block';
  }
}
